<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speak Number Guessing Game</title>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>
    <header>
        <h1>Simple Games</h1>
    </header>

    <div class = "top">
        <h1>Simple Games</h1>
        <div class="centered"></div>
    </div>

    <div class="split left">
        <div class="centered">
        <img src="img/mic2.png" alt="Microphone to speak into"/>
        <h2>Speak Number Guessing Game</h2>
        <h3> Guess a Number Between 1 - 100</h3>
        <p> Speak the number into your microphone</p>
        <div id="msg" class="msg"></div>
        </div>
    </div>
    <!-- div for split left ^^ -->
    <div class="split right">
        <div class="centered">
            <h2>Type Game</h2>
          <h3> Practice your typing skills with a quote from Sherlock Holmes.</h3>
          <h4> Click START to begin!</h4>
          <p> Quote:</p>
          <div id="container" class="container">
          <p id="quote"></p>
          <p id="message"></p>
        </div>

          <div>
            <input type="text" aria-label="current word" id="typed-value"/>
            <button type="button" 
            id="start">Start</button>
          </div>
  <!-- div for button and input -->
        </div> 
        <!-- div for centered -->
    </div>
    <!-- div for split right ^^ -->

    <script src="script.js" defer></script>
</body>
</html>
